name: Daily UK + International chauffeur job search

on:
  schedule:
    # GitHub cron uses UTC. These two schedules plus the UK-time guard below
    # keep delivery targeted at 06:30 Europe/London through both BST and GMT.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What do you want to run?"
        required: true
        default: "job_search"
        type: choice
        options:
          - job_search
          - telegram_setup
      chat_id:
        description: "Telegram CHAT_ID (optional in telegram_setup mode; leave blank to auto-detect)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chauffeur-job-search
  cancel-in-progress: false

jobs:
  chauffeur-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check UK schedule
        id: uk_schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "job_search" ]; then
              echo "run_search=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_search=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          london_offset="$(TZ=Europe/London date +%z)"
          scheduled_cron="${{ github.event.schedule }}"

          if { [ "$scheduled_cron" = "30 5 * * *" ] && [ "$london_offset" = "+0100" ]; } || \
             { [ "$scheduled_cron" = "30 6 * * *" ] && [ "$london_offset" = "+0000" ]; }; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_search=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this UTC slot; it is not the 06:30 UK slot today."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Telegram Setup & Test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'telegram_setup'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
        run: python telegram_setup.py

      - name: Install dependencies
        if: steps.uk_schedule.outputs.run_search == 'true'
        run: pip install -r requirements.txt

      - name: Search UK and international jobs and send alerts
        if: steps.uk_schedule.outputs.run_search == 'true'
        env:
          SMTP_HOST: smtp.hostinger.com
          SMTP_PORT: "465"
          SMTP_SECURITY: ssl
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python smtp_runner.py

      - name: Save seen-job history
        if: steps.uk_schedule.outputs.run_search == 'true'
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "No seen-job changes to save."
            exit 0
          fi
          git config user.name "chauffeur-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/seen_jobs.json
          git commit -m "Update seen chauffeur jobs"
          git push
