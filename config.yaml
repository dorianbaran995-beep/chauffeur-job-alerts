email:
  to: ""
  subject_prefix: "UK + International Chauffeur Jobs"

search:
  # Search the previous 7 days on every daily run. The seen-jobs file prevents
  # vacancies already emailed from being sent again.
  hours_old: 168
  results_per_search: 35
  max_email_jobs: 250
  sites:
    - indeed
    - linkedin
    - glassdoor
    - google
    - zip_recruiter

  keywords:
    - chauffeur
    - private chauffeur
    - family chauffeur
    - private family chauffeur
    - household chauffeur
    - executive chauffeur
    - personal chauffeur
    - private driver
    - personal driver
    - executive driver
    - VIP driver
    - VVIP driver
    - security driver
    - close protection driver
    - principal driver
    - CEO driver

  # UK gets the deepest search. Major international markets use a broad set of
  # terms, while extended global markets use the strongest core terms so the
  # daily scan remains practical while still covering a very wide geography.
  markets:
    - name: United Kingdom
      location: United Kingdom
      country_indeed: uk
      priority: primary

