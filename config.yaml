email:
  to: ""
  subject_prefix: "UK Chauffeur Jobs"

search:
  # Search the previous 7 days on every daily run. The seen-jobs file prevents
  # vacancies already sent from being sent again.
  hours_old: 168
  results_per_search: 50
  max_email_jobs: 250
  sites:
    - indeed
    - linkedin
    - glassdoor
    - google
    - zip_recruiter

  # UK-only search. Keep a wide range of private/VIP driver terminology so
  # relevant vacancies are not missed when employers avoid the word chauffeur.
  keywords:
    - chauffeur
    - private chauffeur
    - family chauffeur
    - private family chauffeur
    - household chauffeur
    - executive chauffeur
    - personal chauffeur
    - private driver
    - personal driver
    - executive driver
    - VIP driver
    - VVIP driver
    - security driver
    - close protection driver
    - principal driver
    - CEO driver

  markets:
    - name: United Kingdom
      location: United Kingdom
      country_indeed: uk
      priority: primary

filter:
  include_title_terms:
    - chauffeur
    - private driver
    - personal driver
    - executive driver
    - VIP driver
    - VVIP driver
    - security driver
    - close protection driver
    - principal driver
    - CEO driver
    - family driver
    - household driver
    - executive transport

  exclude_title_terms:
    - delivery
    - home delivery
    - hgv
    - lgv
    - truck
    - bus driver
    - coach driver
    - van
    - courier
    - parcel
    - food delivery
    - forklift
    - taxi
    - uber
    - rideshare
    - multi drop
    - multidrop
