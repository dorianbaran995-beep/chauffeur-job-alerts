email:
  to: ""
  subject_prefix: "UK Chauffeur + Doncaster Driving Jobs"

search:
  # Search the previous 7 days on every daily run. The seen-jobs file prevents
  # vacancies already sent from being sent again.
  hours_old: 168
  results_per_search: 40
  max_email_jobs: 300
  sites:
    - indeed
    - linkedin
    - glassdoor
    - google
    - zip_recruiter

  # Premium/private driver terms searched across the whole UK coverage grid.
  keywords:
    - chauffeur
    - private chauffeur
    - family chauffeur
    - private family chauffeur
    - household chauffeur
    - executive chauffeur
    - personal chauffeur
    - private driver
    - personal driver
    - executive driver
    - VIP driver
    - VVIP driver
    - security driver
    - close protection driver
    - principal driver
    - CEO driver

  # Broader Doncaster-only search. This deliberately includes the generic word
  # "driver", then uses the local title exclusions below to remove delivery,
  # HGV, courier, taxi and other low-value noise.
  local_keywords:
    - driver
    - chauffeur
    - private chauffeur
    - private driver
    - personal driver
    - executive driver
    - company driver
    - VIP driver
    - security driver
    - close protection driver
    - transport driver
    - fleet driver
    - shuttle driver
    - patient transport driver
    - minibus driver
    - school transport driver
    - vehicle movement driver
    - trade plate driver

  # The broad UK query is retained, but we also search a city grid so a job is
  # not missed simply because a job board does not return it for "United Kingdom".
  markets:
    - name: United Kingdom
      location: United Kingdom
      country_indeed: uk
      priority: primary
      distance: 100

