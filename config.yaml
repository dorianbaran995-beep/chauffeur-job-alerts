filter:
  include_title_terms:
    - chauffeur
    - private driver
    - personal driver
    - executive driver
    - VIP driver
    - VVIP driver
    - security driver
    - close protection driver
    - principal driver
    - CEO driver
    - family driver
    - household driver
    - executive transport

  # Broader local matching is allowed only for the Doncaster Area market.
  local_include_title_terms:
    - driver
    - chauffeur

  exclude_title_terms:
    - delivery
    - home delivery
    - hgv
    - lgv
    - truck
    - bus driver
    - coach driver
    - van
    - courier
    - parcel
    - food delivery
    - forklift
    - taxi
    - uber
    - rideshare
    - multi drop
    - multidrop

  local_exclude_title_terms:
    - class 1
    - class 2
    - 7.5t
    - adr
    - tanker
    - tipper
    - refuse
    - waste
    - bin lorry
    - tram
    - train driver
    - warehouse
    - reach truck
    - order picker
    - pcv
